<!-- KST Real-Time Clock Bar + Next-Up Logic -->
<div id="kst-clock-bar">
  <div id="kst-time-block">
    <span>🇰🇷</span>
    <span id="kst-date"></span>
    <span style="opacity:0.5">·</span>
    <span id="kst-time" style="font-variant-numeric:tabular-nums">--:--:--</span>
    <span style="opacity:0.7;font-weight:400;font-size:11px">KST</span>
  </div>
  <div id="next-up-bar">▶ &hellip;</div>
</div>

<script>
(function () {
  /* All scheduled events in KST (UTC+9) — used for global "Next Up" bar */
  var EVENTS = [
    { dt: '2026-07-26T13:00', label: 'Depart YVR ✈️', page: 'jul-26' },
    { dt: '2026-07-27T16:05', label: 'Arrive Seoul ICN 🛬', page: 'jul-27' },
    { dt: '2026-07-27T18:00', label: 'Explore Myeongdong 🛒', page: 'jul-27' },
    { dt: '2026-07-27T19:00', label: 'Dinner: Gwangjang Market 🥟', page: 'jul-27' },
    { dt: '2026-07-28T09:30', label: 'VIC Lab Color Analysis 🎨', page: 'jul-28' },
    { dt: '2026-07-28T11:30', label: 'Mangwon Market Lunch 🍜', page: 'jul-28' },
    { dt: '2026-07-28T16:30', label: 'Hair Tattoo Appointment 💇', page: 'jul-28' },
    { dt: '2026-07-28T19:00', label: 'Dinner: Gebang Sikdang 🦀', page: 'jul-28' },
    { dt: '2026-07-29T09:00', label: 'Studio KJD Hanbok 👘', page: 'jul-29' },
    { dt: '2026-07-29T12:00', label: 'Lunch: Jalpajin Buckwheat 🍜', page: 'jul-29' },
    { dt: '2026-07-29T19:00', label: 'Dinner: Sancheong Charcoal Garden 🔥', page: 'jul-29' },
    { dt: '2026-07-30T08:00', label: 'DMZ Tour 🪖', page: 'jul-30' },
    { dt: '2026-07-30T15:00', label: 'Lunch: Oegojip Seolleongtang 🍲', page: 'jul-30' },
    { dt: '2026-07-30T18:30', label: 'Dinner: Hannam Rotisserie Chicken 🍗', page: 'jul-30' },
    { dt: '2026-07-31T13:15', label: 'Depart Seoul → Jeju ✈️', page: 'jul-31' },
    { dt: '2026-07-31T14:30', label: 'Arrive Jeju 🌊', page: 'jul-31' },
    { dt: '2026-07-31T18:00', label: 'Explore Dongmun Market 🛒', page: 'jul-31' },
    { dt: '2026-07-31T19:30', label: 'Dinner: Badang-Gil Abalone 🐚', page: 'jul-31' },
    { dt: '2026-08-01T05:30', label: 'Sunrise: Seongsan Ilchulbong 🌅', page: 'aug-01' },
    { dt: '2026-08-01T12:00', label: 'Lunch: Nolaba Ramen 🍜', page: 'aug-01' },
    { dt: '2026-08-01T13:30', label: 'Haenyeo Diver Show 🤿', page: 'aug-01' },
    { dt: '2026-08-01T19:30', label: 'Dinner: Black Pork BBQ 🐷', page: 'aug-01' },
    { dt: '2026-08-02T09:00', label: 'Manjanggul Cave 🕍', page: 'aug-02' },
    { dt: '2026-08-02T12:00', label: 'Lunch: Sambo Restaurant 🐟', page: 'aug-02' },
    { dt: '2026-08-02T14:30', label: 'Sangumburi Crater + Eco Land 🌿', page: 'aug-02' },
    { dt: '2026-08-03T09:30', label: 'Yeomiji Botanical Garden 🌸', page: 'aug-03' },
    { dt: '2026-08-03T12:00', label: 'Lunch: Jeju Sun Buckwheat 🍜', page: 'aug-03' },
    { dt: '2026-08-03T14:00', label: 'Osulloc Tea Museum 🍵', page: 'aug-03' },
    { dt: '2026-08-04T13:00', label: 'Depart Jeju → Busan ✈️', page: 'aug-04' },
    { dt: '2026-08-04T14:05', label: 'Arrive Busan 🌊', page: 'aug-04' },
    { dt: '2026-08-04T17:00', label: 'Haeundae Beach + Market 🏖️', page: 'aug-04' },
    { dt: '2026-08-05T09:00', label: 'Sky Capsule + Blueline Park 🚡', page: 'aug-05' },
    { dt: '2026-08-05T12:00', label: 'Lunch: Dwaeji Gukbap 🍲', page: 'aug-05' },
    { dt: '2026-08-05T14:30', label: 'Haedong Yonggungsa Temple 🏯', page: 'aug-05' },
    { dt: '2026-08-05T19:00', label: 'Dinner: Fresh Seafood 🦞', page: 'aug-05' },
    { dt: '2026-08-06T09:30', label: 'Gamcheon Culture Village 🎨', page: 'aug-06' },
    { dt: '2026-08-06T12:00', label: 'Lunch: BIFF Square 🎬', page: 'aug-06' },
    { dt: '2026-08-06T14:00', label: 'Jagalchi Market + Songdo Cable Car 🦀', page: 'aug-06' },
    { dt: '2026-08-06T19:00', label: 'Dinner: Seafood Feast 🦐', page: 'aug-06' },
    { dt: '2026-08-07T10:30', label: 'KTX: Busan → Seoul 🚄', page: 'aug-07' },
    { dt: '2026-08-07T15:00', label: 'Seoul Forest + Seongsu 🌳', page: 'aug-07' },
    { dt: '2026-08-08T10:00', label: 'COEX + Starfield Library 📚', page: 'aug-08' },
    { dt: '2026-08-08T11:00', label: 'K-pop Pilgrimage: HYBE/SM/JYP 🎵', page: 'aug-08' },
    { dt: '2026-08-08T13:00', label: 'Lunch: 논현삼계탕', page: 'aug-08' },
    { dt: '2026-08-08T19:00', label: 'Dinner: 설매네', page: 'aug-08' },
    { dt: '2026-08-08T20:30', label: 'Lotte Tower Night View 🌃', page: 'aug-08' },
    { dt: '2026-08-09T09:00', label: 'Brunch: Birch Coffee ☕', page: 'aug-09' },
    { dt: '2026-08-09T17:45', label: 'Depart Seoul ✈️', page: 'aug-09' },
  ];

  function parseKST(s) {
    return new Date(s + ':00+09:00');
  }

  function getNowUTC() { return Date.now(); }

  function getKSTDisplay() {
    var now = new Date();
    var kst = new Date(now.getTime() + 9 * 3600 * 1000);
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return {
      time: pad(kst.getUTCHours()) + ':' + pad(kst.getUTCMinutes()) + ':' + pad(kst.getUTCSeconds()),
      date: days[kst.getUTCDay()] + ', ' + months[kst.getUTCMonth()] + ' ' + kst.getUTCDate()
    };
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function findNextEvent() {
    var now = getNowUTC();
    var best = null, minDiff = Infinity;
    EVENTS.forEach(function(e) {
      var diff = parseKST(e.dt).getTime() - now;
      if (diff > 0 && diff < minDiff) { minDiff = diff; best = { e: e, diff: diff }; }
    });
    return best;
  }

  function fmtDiff(ms) {
    var h = Math.floor(ms / 3600000);
    var m = Math.floor((ms % 3600000) / 60000);
    if (h >= 48) return 'in ' + Math.floor(h / 24) + 'd';
    if (h >= 1)  return 'in ' + h + 'h ' + m + 'm';
    if (m >= 1)  return 'in ' + m + 'm';
    return 'soon';
  }

  function tick() {
    var d = getKSTDisplay();
    document.getElementById('kst-time').textContent = d.time;
    document.getElementById('kst-date').textContent = d.date;
    var n = findNextEvent();
    var bar = document.getElementById('next-up-bar');
    if (n) {
      bar.textContent = '▶ ' + n.e.label + ' · ' + fmtDiff(n.diff);
    } else {
      bar.textContent = '🎉 Trip complete — great memories!';
    }
  }

  /* Per-page: highlight the next upcoming event card */
  function highlightNextCard() {
    var cards = document.querySelectorAll('.event-card[data-dt]');
    var now = getNowUTC();
    var nextCard = null, minDiff = Infinity;
    cards.forEach(function(c) {
      var diff = parseKST(c.dataset.dt).getTime() - now;
      if (diff > 0 && diff < minDiff) { minDiff = diff; nextCard = c; }
    });
    if (nextCard) {
      nextCard.classList.add('is-next');
      var pill = document.createElement('div');
      pill.className = 'next-up-pill';
      pill.textContent = '▶ NEXT UP';
      nextCard.insertBefore(pill, nextCard.firstChild);
      setTimeout(function() {
        nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 900);
    }
  }

  /* Card → Map: click a card with data-lat/data-lng to fly the map to that pin */
  document.addEventListener('click', function(e) {
    var card = e.target.closest('.event-card[data-lat]');
    if (!card || !window.pageMap) return;
    var lat = parseFloat(card.getAttribute('data-lat'));
    var lng = parseFloat(card.getAttribute('data-lng'));
    if (isNaN(lat) || isNaN(lng)) return;
    window.pageMap.flyTo([lat, lng], 16, { duration: 0.6, easeLinearity: 0.5 });
    var best = null, bestDist = Infinity;
    (window.pageMarkers || []).forEach(function(pm) {
      var d = Math.pow(pm.lat - lat, 2) + Math.pow(pm.lng - lng, 2);
      if (d < bestDist) { bestDist = d; best = pm; }
    });
    if (best) {
      best.marker.openPopup();
      var el = best.marker.getElement();
      if (el) {
        el.classList.add('marker-highlight');
        setTimeout(function() { el.classList.remove('marker-highlight'); }, 800);
      }
    }
    var mapEl = document.querySelector('.day-map');
    if (mapEl) mapEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  document.addEventListener('DOMContentLoaded', function() {
    tick();
    setInterval(tick, 1000);
    highlightNextCard();
  });
})();
</script>
